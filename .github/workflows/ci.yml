name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: chunkkit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # before tests: CLI e2e tests spawn dist/cli.js
      - run: npm test
      - run: npm run coverage
      - run: npm pack --dry-run
